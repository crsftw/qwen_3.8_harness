name: Dependabot auto-merge

# Auto-enables auto-merge (squash) for Dependabot PATCH/MINOR updates. GitHub
# still holds the merge until required status checks pass, so nothing merges
# unless the "monitor test suite" CI is green. MAJOR updates are left for
# manual review. Requires: repo setting "Allow auto-merge" ON + a branch
# ruleset on main that requires the CI check.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2
      - name: Enable auto-merge for patch/minor
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
